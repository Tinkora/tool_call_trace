name: Deploy Pages

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  assemble:
    name: Assemble static site
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified WASM package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/wasm-package

      - name: Test Pages assembler
        run: ruby scripts/test_assemble_pages.rb

      - name: Assemble Pages source
        run: ruby scripts/assemble_pages.rb --wasm-package "$RUNNER_TEMP/wasm-package"

      - name: Upload Pages source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-source-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: Tinkora/.github/.github/workflows/reusable-pages.yml@ed1ae1d6e3a5f1887f415f985836bec954d1ed41 # Tinkora organization baseline
    with:
      source-artifact-name: pages-source-${{ github.run_id }}

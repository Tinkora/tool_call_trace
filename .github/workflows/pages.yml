name: Deploy Pages

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  assemble:
    name: Assemble static site
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-package

      - name: Test Pages assembler
        run: ruby scripts/test_assemble_pages.rb

      - name: Assemble Pages source
        run: ruby scripts/assemble_pages.rb --wasm-package "$RUNNER_TEMP/wasm-package"

      - name: Upload Pages source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: Tinkora/.github/.github/workflows/reusable-pages.yml@e967aed0860957b24daf57e66766713c60b5bcae # Tinkora organization baseline
    with:
      source-artifact-name: pages-source-${{ github.run_id }}-${{ github.run_attempt }}

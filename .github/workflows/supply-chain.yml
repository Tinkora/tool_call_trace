name: Supply chain

'on':
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
    uses: Tinkora/.github/.github/workflows/reusable-supply-chain.yml@ed1ae1d6e3a5f1887f415f985836bec954d1ed41 # Tinkora organization baseline
    with:
      working-directory: .
      toolchain: 1.88.0

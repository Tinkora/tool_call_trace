name: Documentation quality

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown and repository docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Parse workflow files
        run: find .github/workflows -type f -name '*.yml' -exec "$RUNNER_TEMP/actionlint" {} +

      - name: Test documentation checker
        run: ruby scripts/test_check_docs.rb

      - name: Check repository documentation
        run: ruby scripts/check_docs.rb

      - name: Test reusable workflow contracts
        run: ruby scripts/test_check_workflow_contracts.rb

      - name: Check reusable workflow contracts
        run: ruby scripts/check_workflow_contracts.rb

      - name: Test Pages assembler
        run: ruby scripts/test_assemble_pages.rb

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          collect: all
          online-audits: false
          advanced-security: false
          annotations: true
